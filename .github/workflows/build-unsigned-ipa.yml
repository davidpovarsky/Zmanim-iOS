name: Build Zmanim unsigned IPA

on:
  push:
    branches:
      - main
      - fix/runtime-widget-notification-validation
      - feature/met-weather-widget-paging-eod
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6 and verify iOS SDK
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          echo "Active Developer Directory: $(xcode-select -p)"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK version: $SDK_VERSION"
          MAJOR_SDK="$(echo "$SDK_VERSION" | cut -d. -f1)"
          if [ "$MAJOR_SDK" -lt 26 ]; then
            echo "Error: iOS SDK version is $SDK_VERSION (less than 26)" >&2
            exit 1
          fi
          xcrun simctl list runtimes

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Generate project
        run: xcodegen generate

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build unsigned device app
        run: |
          set +e
          mkdir -p build
          xcodebuild build \
            -project Zmanim.xcodeproj \
            -scheme Zmanim \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build/device-build.log
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          if [ "$XCODEBUILD_STATUS" -ne 0 ] && ! grep -q '\*\* BUILD SUCCEEDED \*\*' build/device-build.log; then
            echo "xcodebuild failed without a successful build result"
            exit "$XCODEBUILD_STATUS"
          fi

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DeviceDerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Zmanim-unsigned.ipa Payload
          chmod +x scripts/verify-localization-completeness.sh scripts/verify-ipa-extensions.sh scripts/verify-ipa-localizations.sh scripts/verify-ipa-windowing.sh
          bash scripts/verify-localization-completeness.sh
          bash scripts/verify-ipa-windowing.sh Zmanim-unsigned.ipa
          bash scripts/verify-ipa-extensions.sh Zmanim-unsigned.ipa
          bash scripts/verify-ipa-localizations.sh Zmanim-unsigned.ipa

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload unsigned IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: Zmanim-unsigned-IPA
          path: |
            Zmanim-unsigned.ipa
            build/device-build.log
          if-no-files-found: error
