name: Build and validate Zmanim

on:
  push:
    branches:
      - main
      - fix/runtime-widget-notification-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-validation:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Select simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16 \(/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 15 \(/ {print $2; exit}')"
          fi
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl erase "$DEVICE_ID" || true
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for Simulator and run unit tests
        run: |
          set +e
          xcodebuild test \
            -project Zmanim.xcodeproj \
            -scheme Zmanim \
            -destination "id=$DEVICE_ID" \
            -configuration Debug \
            -only-testing ZmanimTests \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-test.log
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          if [ "$XCODEBUILD_STATUS" -ne 0 ] && ! grep -q '\*\* TEST SUCCEEDED \*\*' build/simulator-test.log; then
            echo "xcodebuild failed without a successful XCTest result"
            exit "$XCODEBUILD_STATUS"
          fi

      - name: Validate simulator product structure and Info.plists
        run: |
          set -euo pipefail
          APP_PATH="build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/Zmanim.app"
          WIDGET_PATH="$APP_PATH/PlugIns/ZmanimWidgets.appex"
          NOTIFICATION_PATH="$APP_PATH/PlugIns/ZmanimNotificationContent.appex"
          test -d "$APP_PATH"
          test -d "$WIDGET_PATH"
          test -d "$NOTIFICATION_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          plutil -lint "$WIDGET_PATH/Info.plist"
          plutil -lint "$NOTIFICATION_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET_PATH/Info.plist" | grep -Fx 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$NOTIFICATION_PATH/Info.plist" | grep -Fx 'com.apple.usernotifications.content-extension'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionMainStoryboard' "$NOTIFICATION_PATH/Info.plist" | grep -Fx 'MainInterface'
          /usr/libexec/PlistBuddy -c 'Print :NSWidgetWantsLocation' "$WIDGET_PATH/Info.plist" | grep -Fx 'true'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:UNNotificationExtensionCategory' "$NOTIFICATION_PATH/Info.plist" | grep -F 'ZMANIM_ALERT'
          ! /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$NOTIFICATION_PATH/Info.plist"
          test -d "$NOTIFICATION_PATH/MainInterface.storyboardc" || test -f "$NOTIFICATION_PATH/MainInterface.storyboardc"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$NOTIFICATION_PATH/Info.plist"

      - name: Run simulator runtime validation and capture diagnostics
        run: |
          chmod +x scripts/run-simulator-validation.sh
          bash scripts/run-simulator-validation.sh "$DEVICE_ID" "build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/Zmanim.app"

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-validation-diagnostics
          path: |
            build/simulator-test.log
            diagnostics/
            build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/Zmanim.app/**/Info.plist
          if-no-files-found: warn

  unsigned-ipa:
    needs: simulator-validation
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set +e
          xcodebuild build \
            -project Zmanim.xcodeproj \
            -scheme Zmanim \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build/device-build.log
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          if [ "$XCODEBUILD_STATUS" -ne 0 ] && ! grep -q '\*\* BUILD SUCCEEDED \*\*' build/device-build.log; then
            echo "xcodebuild failed without a successful build result"
            exit "$XCODEBUILD_STATUS"
          fi

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DeviceDerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Zmanim-unsigned.ipa Payload
          chmod +x scripts/verify-ipa-extensions.sh
          bash scripts/verify-ipa-extensions.sh Zmanim-unsigned.ipa

      - name: Upload unsigned IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: Zmanim-unsigned-IPA
          path: |
            Zmanim-unsigned.ipa
            build/device-build.log
          if-no-files-found: error
