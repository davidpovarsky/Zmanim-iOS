name: Zmanim
options:
  bundleIdPrefix: com.davidpovarsky
  developmentLanguage: he
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_LANGUAGE: he
packages:
  SwiftUISky:
    path: Packages/SwiftUISky
  OneBusAwayWeather:
    path: Packages/OneBusAwayWeather
targets:
  Zmanim:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.Zmanim
        DEVELOPMENT_LANGUAGE: he
        CODE_SIGN_ENTITLEMENTS: Supporting/Zmanim.entitlements
    info:
      path: Supporting/Zmanim-Info.plist
      properties:
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations:
          - he
          - en
        CFBundleDisplayName: Zmanim
        CFBundleName: Zmanim
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "המיקום משמש לחישוב זמני היום המדויקים באזור שלך."
        NSSupportsLiveActivities: true
    dependencies:
      - package: SwiftUISky
        product: SwiftUISky
      - package: OneBusAwayWeather
        product: OneBusAwayWeatherCore
      - package: OneBusAwayWeather
        product: OneBusAwayWeatherUI
      - target: ZmanimWidgets
        embed: true
      - target: ZmanimNotificationContent
        embed: true
  ZmanimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Widgets
      - Sources/Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.Zmanim.Widgets
        DEVELOPMENT_LANGUAGE: he
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Supporting/ZmanimWidgets.entitlements
    info:
      path: Supporting/ZmanimWidgets-Info.plist
      properties:
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations:
          - he
          - en
        CFBundleDisplayName: Zmanim Widgets
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ZmanimNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - Sources/NotificationContent
      - Sources/Shared/SnoozeRequest.swift
      - Sources/Shared/SolarArcGeometry.swift
      - path: Resources
        buildPhase: resources
    resources:
      - Sources/NotificationContent/MainInterface.storyboard
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.Zmanim.NotificationContent
        DEVELOPMENT_LANGUAGE: he
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "UserNotificationsUI", "-framework", "UserNotifications"]
    info:
      path: Supporting/ZmanimNotificationContent-Info.plist
      properties:
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations:
          - he
          - en
        CFBundleDisplayName: Zmanim Alert
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionMainStoryboard: MainInterface
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [ZMANIM_ALERT]
            UNNotificationExtensionInitialContentSizeRatio: 0.6
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
  ZmanimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ZmanimTests
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: Zmanim
      - package: OneBusAwayWeather
        product: OneBusAwayWeatherCore
      - package: OneBusAwayWeather
        product: OneBusAwayWeatherUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.Zmanim.Tests
        DEVELOPMENT_LANGUAGE: he
  ZmanimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ZmanimUITests
    dependencies:
      - target: Zmanim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.Zmanim.UITests
        TEST_TARGET_NAME: Zmanim
        DEVELOPMENT_LANGUAGE: he
schemes:
  Zmanim:
    build:
      targets:
        Zmanim: all
        ZmanimWidgets: all
        ZmanimNotificationContent: all
        ZmanimTests: [test]
        ZmanimUITests: [test]
    test:
      targets:
        - ZmanimTests
        - ZmanimUITests
    archive:
      config: Release
  ZmanimWidgets:
    build:
      targets:
        ZmanimWidgets: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: ZmanimWidget
        _XCWidgetFamily: systemMedium
        _XCWidgetDefaultView: timeline
  ZmanimWidgets_Small:
    build:
      targets:
        ZmanimWidgets: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: ZmanimWidget
        _XCWidgetFamily: systemSmall
        _XCWidgetDefaultView: timeline
  ZmanimWidgets_Medium:
    build:
      targets:
        ZmanimWidgets: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: ZmanimWidget
        _XCWidgetFamily: systemMedium
        _XCWidgetDefaultView: timeline
  ZmanimWidgets_Large:
    build:
      targets:
        ZmanimWidgets: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: ZmanimWidget
        _XCWidgetFamily: systemLarge
        _XCWidgetDefaultView: timeline
  ZmanimWidgets_ExtraLarge:
    build:
      targets:
        ZmanimWidgets: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: ZmanimWidget
        _XCWidgetFamily: systemExtraLarge
        _XCWidgetDefaultView: timeline
